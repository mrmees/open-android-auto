/*
 * Car Control channel messages (GAL channel type 19, CAR_CONTROL)
 * Handler: hyc.java (16.2) / hxp.java (16.1), log tag: CAR.GAL.CAR_CONTROL
 *
 * This channel provides VHAL (Vehicle HAL) property access — HVAC controls,
 * seat temperature, defrost, toll card status, etc. The phone registers listeners
 * for car properties and receives change events. It can also set property values.
 *
 * Message IDs (from vik.m36843p/m36844q):
 *   0x8001 = CAR_CONTROL_SET_CAR_PROPERTY_VALUE_REQUEST    (Phone→HU, wbq)
 *   0x8002 = CAR_CONTROL_SET_CAR_PROPERTY_VALUE_RESPONSE   (HU→Phone, wbr)
 *   0x8003 = CAR_CONTROL_REGISTER_CAR_PROPERTY_LISTENERS_REQUEST (Phone→HU, waz)
 *   0x8004 = CAR_CONTROL_REGISTER_CAR_PROPERTY_LISTENERS_RESPONSE (HU→Phone, wba)
 *   0x8005 = CAR_CONTROL_CAR_PROPERTY_CHANGE_EVENT         (HU→Phone, vwg)
 *   0x8006 = CAR_CONTROL_CAR_ACTION_NOTIFICATION           (Phone→HU, vvv)
 *   0x8007 = CAR_CONTROL_CAR_CONTROL_GROUP_UPDATE           (HU→Phone, vvz)
 *
 * No msg ID offset — hyc extends iav directly, vik.m36844q maps IDs unchanged.
 * Phone handler receives: 0x8002, 0x8004, 0x8005, 0x8007 (HU→Phone).
 * Phone handler drops inbound 0x8003 and 0x8006 as unexpected; both are
 * Phone→HU send-only messages.
 *
 * Proto3 sub-messages (CarProperty, CarAreaId, CarAction, CarPropertyValue,
 * CarPropertyControl, IntValues, FloatValues, LongValues) are in
 * CarPropertyData.proto — split because the APK compiles those as proto3.
 *
 * APK: AA v16.2 (verified 2026-03-07)
 */

syntax = "proto2";

import "oaa/carcontrol/CarPropertyData.proto";
import "oaa/common/StatusEnum.proto";

package oaa.proto.messages;

// Android Auto 17.3 phone-endpoint direction matrix:
// 0x8001 SetCarPropertyValueRequest: Phone -> HU; phone owns correlation.
// 0x8002 SetCarPropertyValueResponse: HU -> Phone; phone matches request UUID.
// 0x8003 RegisterCarPropertyListenersRequest: Phone -> HU; inbound is unexpected.
// 0x8004 RegisterCarPropertyListenersResponse: HU -> Phone; phone updates state.
// 0x8005 CarPropertyChangeEvent: HU -> Phone; phone updates listeners.
// 0x8006 CarActionNotification: Phone -> HU; inbound is unexpected.
// 0x8007 CarControlGroupUpdate: HU -> Phone; replace matching group by type.

// ============================================================================
// Enums (proto2)
// ============================================================================

// CarControlStatus — RETRACTED
// The status fields in SetCarPropertyValueResponse and SetCarPropertyListenerResult
// use the shared ProtocolStatus enum (vyh, 34 values) on the wire, NOT this 3-value
// enum. Car-control-specific codes: -26 (SET_REQUEST_FAILED), -27 (LISTENER_REGISTRATION_FAILED).
// See oaa/common/ProtocolStatus for the full enum.

// Side affinity for controls — driver vs passenger side
// (APK class: vvx field 6 validator; SafeParcelable: CarControl.sideAffinity)
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
enum SideAffinity {
    SIDE_NONE = 0;
    SIDE_DRIVER = 1;
    SIDE_PASSENGER = 2;
}

// Control group type (APK class: vvy field 1)
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
enum CarControlGroupType {
    CAR_CONTROL_GROUP_UNKNOWN = 0;
    CAR_CONTROL_GROUP_PRIMARY = 1;
}

// Metadata type for CarControl entries (APK enum: vug)
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
enum CarControlMetadataType {
    METADATA_UNKNOWN = 0;
    METADATA_COMPACT_UI = 1;
    METADATA_PREFER_STATUS_BAR = 2;  // NEW in 16.2
}

// ============================================================================
// Sub-messages (proto2)
// ============================================================================

// APK class: vvu (16.2) / vwi (16.1) → wraps CarAction for action-only controls
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarActionControl {
    optional CarAction action = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// APK class: vvx (16.2) / vwl (16.1) → SafeParcelable: CarControl
// A single control entry — either a property, action, or nested group.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarControl {
    oneof control {
        CarPropertyControl property_control = 1; // vuk  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
        CarActionControl action_control = 2; // vvu  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
        CarControlGroup control_group = 3; // vvy (recursive)  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    }
    optional bool enabled = 4;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    repeated CarControlMetadataType metadata = 5;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional SideAffinity side_affinity = 6;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// APK class: vvy (16.2) / vwm (16.1) → SafeParcelable: CarControlGroup
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarControlGroup {
    optional CarControlGroupType group_type = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    repeated CarControl controls = 2;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// ============================================================================
// Top-level messages (received by handler)
// ============================================================================

// 0x8001: SetCarPropertyValueRequest (APK class: wbq 16.2 / wca 16.1)
// Phone requests the HU to set a car property value and owns request correlation.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message SetCarPropertyValueRequest {
    optional CarProperty car_property = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional CarPropertyValue property_value = 2;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional string request_id = 3; // UUID for correlating response  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8002: SetCarPropertyValueResponse (APK class: wbr 16.2 / wcb 16.1)
// HU responds to the phone's set-property request; the phone matches request_id.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message SetCarPropertyValueResponse {
    optional CarProperty car_property = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional enums.Status.Enum status = 2; // ProtocolStatus (vyh/xin) — shared AA status enum. 0=SUCCESS, -26=SET_FAILED, -27=LISTENER_FAILED  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional string request_id = 3; // UUID correlating to original request  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional int32 error_code = 4; // CarPropertySetError code  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8003: RegisterCarPropertyListenersRequest (APK class: waz 16.2)
// Phone subscribes to HU change events for a list of properties.
// An inbound copy at the phone endpoint is unexpected.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message RegisterCarPropertyListenersRequest {
    repeated CarProperty car_properties = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8004: RegisterCarPropertyListenersResponse (APK class: wba 16.2 / wbk 16.1)
// HU responds with per-property registration results; the phone updates its state.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message RegisterCarPropertyListenersResponse {
    repeated SetCarPropertyListenerResult results = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// APK class: vwh (16.2) / vwv (16.1) — individual listener registration result
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message SetCarPropertyListenerResult {
    optional CarProperty car_property = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional enums.Status.Enum status = 2; // ProtocolStatus (vyh/xin) — shared AA status enum  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8005: CarPropertyChangeEvent (APK class: vwg 16.2 / vwu 16.1)
// HU notifies the phone that a car property value changed.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarPropertyChangeEvent {
    optional CarProperty car_property = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional CarPropertyValue property_value = 2;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    optional int32 status = 3; // 1=AVAILABLE, 2=UNAVAILABLE  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8006: CarActionNotification (APK class: vvv 16.2 / vwj 16.1)
// Phone tells the HU to trigger an application launch action.
// An inbound copy at the phone endpoint is unexpected.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarActionNotification {
    optional CarAction action = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// 0x8007: CarControlGroupUpdate (APK class: vvz 16.2 / vwn 16.1)
// HU sends a replacement-style control group update to the phone.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarControlGroupUpdate {
    optional CarControlGroup car_control_group = 1;  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}

// ============================================================================
// SDP Channel Descriptor
// ============================================================================

// CarControlChannelDescriptor (APK class: vwa 16.2 / vwo 16.1)
// Describes the car control channel's available property configs, controls, and actions.
// Sent during channel setup to inform the phone about HU capabilities.
// confidence: silver [apk_deep_trace, cross_version, deep_trace]
message CarControlChannelDescriptor {
    repeated CarPropertyConfig property_configs = 1; // vuj  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    repeated CarControl controls = 2; // vvx — NOT CarControlGroup (16.2 DB confirmed)  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
    repeated CarActionEntry action_entries = 3; // vua  // confidence: silver [apk_deep_trace, cross_version, deep_trace]
}
