syntax="proto2";

package oaa.proto.messages;

// Wire message 0x800D, Phone->HU on the video channel.
// confidence: gold [apk_deep_trace, cross_version]
message IntegratedOverlayParametersNotification
{
    repeated IntegratedOverlayParameters parameters = 1;  // confidence: gold [apk_deep_trace, cross_version]
}

// One integrated-overlay option: type, rectangular bounds, and scale.
// confidence: gold [apk_deep_trace, cross_version]
message IntegratedOverlayParameters
{
    optional int32 overlay_type = 1;  // confidence: gold [apk_deep_trace, cross_version]
    optional IntegratedOverlayBounds bounds = 2;  // confidence: gold [apk_deep_trace, cross_version]
    optional IntegratedOverlayScale scale = 3;  // confidence: gold [apk_deep_trace, cross_version]
}

// Signed Android Rect edges copied without coordinate conversion.
// confidence: gold [apk_deep_trace, cross_version]
message IntegratedOverlayBounds
{
    optional int32 left = 1;  // confidence: gold [apk_deep_trace, cross_version]
    optional int32 top = 2;  // confidence: gold [apk_deep_trace, cross_version]
    optional int32 right = 3;  // confidence: gold [apk_deep_trace, cross_version]
    optional int32 bottom = 4;  // confidence: gold [apk_deep_trace, cross_version]
}

// Wrapped floating-point overlay scale value.
// confidence: gold [apk_deep_trace, cross_version]
message IntegratedOverlayScale
{
    optional float value = 1;  // confidence: gold [apk_deep_trace, cross_version]
}
