syntax="proto2";

package oaa.proto.messages;

// APK class: vye (16.1) / vxq (16.2)
// Wire msg 0x800E, HU->Phone (video channel)
// vdp internal name: MEDIA_MESSAGE_INTEGRATED_OVERLAY_START_NOTIFICATION
// Notifies the phone that integrated overlay projection has started.
// Field 1 is passed to the phone-side display callback.
// Previously misidentified as VideoFocusNotification — field 1 is NOT a focus mode.
// confidence: gold [apk_deep_trace, cross_version]
message IntegratedOverlayStartNotification
{
    optional int32 display_session_id = 1;  // confidence: gold [apk_deep_trace, cross_version]
}
