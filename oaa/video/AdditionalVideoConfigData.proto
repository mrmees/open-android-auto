/*
 * Discovered via APK analysis (wcb in 16.2, wcm in 16.1)
 * Additional video configuration for AV channel setup.
 * Includes display insets, UI theme, and display element preferences.
 */

syntax="proto2";

package oaa.proto.data;

// confidence: silver [apk_static, cross_version]
message AdditionalVideoConfig
{
    // These three fields were historically mislabeled as resolution ranges.
    // Phone-side display construction consumes all three as Rect-style insets.
    optional VideoInsets display_insets = 1; // 17.3: xml.d -> xht; bounds used by itl.c  // confidence: silver [apk_static, cross_version]
    optional VideoInsets field_2_insets = 2; // 17.3: xml.e -> xht  // confidence: silver [apk_static, cross_version]
    optional VideoInsets field_3_insets = 3; // 17.3: xml.f -> xht  // confidence: silver [apk_static, cross_version]
    optional UITheme ui_theme = 4; // APK: wcr enum (16.1) — light/dark/auto (0=auto, 1=light, 2=dark)  // confidence: silver [apk_static, cross_version]
    // HU-provided native UI features. When the HU requests GAL version 4.3+,
    // the phone uses these flags to avoid duplicating the corresponding
    // projected element. Android Auto 17.3 ignores this list for a lower
    // request. The historical field name is retained for source compatibility.
    repeated UIElement hidden_ui_elements = 5; // 17.3: xml.h -> CarDisplayUiFeatures  // confidence: silver [apk_static, cross_version]
    repeated VideoResizeAction resize_actions = 6; // APK: vux (16.2), vvl (16.1) — supported resize behaviors  // confidence: silver [apk_static, cross_version]
    repeated VideoMarginConfig margin_configs = 7; // APK: vwp (16.2), vxd (16.1) — margin/inset configs  // confidence: silver [apk_static, cross_version]
    optional BlendedUIConfig blended_ui_config = 8; // 17.1: xol.k -> xhj; 17.3: xml.k -> xfi  // confidence: silver [apk_static, cross_version]
}

// APK class: vux (16.2), vvl (16.1) — video resize action wrapper
// confidence: silver [apk_static, cross_version]
message VideoResizeAction
{
    optional ResizeActionType action = 1;  // confidence: silver [apk_static, cross_version]
}

// APK class: vwp (16.2), vxd (16.1) — margin/inset configuration
// confidence: silver [apk_static, cross_version]
message VideoMarginConfig
{
    optional UIElementPosition insets = 1; // 17.3: xgv.b -> xlh  // confidence: silver [apk_static, cross_version]
}

// APK class: vxn (16.2), vyb (16.1), xht (17.3) — display inset values
// confidence: silver [apk_static, cross_version]
message VideoInsets
{
    optional uint32 top = 1; // Rect conversion: new Rect(field3, field1, field4, field2)  // confidence: silver [apk_static, cross_version]
    optional uint32 bottom = 2;  // confidence: silver [apk_static, cross_version]
    optional uint32 left = 3;  // confidence: silver [apk_static, cross_version]
    optional uint32 right = 4;  // confidence: silver [apk_static, cross_version]
}

// Rect-style coordinates used by margin configs and native UI elements. The
// generated APK keeps this as a distinct message type from VideoInsets even
// though the two messages have the same wire shape.
// confidence: silver [apk_static, cross_version]
message UIElementPosition
{
    optional uint32 top = 1;  // confidence: silver [apk_static, cross_version]
    optional uint32 bottom = 2;  // confidence: silver [apk_static, cross_version]
    optional uint32 left = 3;  // confidence: silver [apk_static, cross_version]
    optional uint32 right = 4;  // confidence: silver [apk_static, cross_version]
}

// Blended native/projected UI layout. Converted directly to
// CarDisplayBlendedUiConfig by the phone display pipeline.
// confidence: silver [apk_static, cross_version]
message BlendedUIConfig
{
    optional DisplayCornerRadii corner_radii = 1; // 17.3: xfi.c -> xgs  // confidence: silver [apk_static, cross_version]
    repeated NativeUIElement native_ui_elements = 2; // 17.3: xfi.d -> xir  // confidence: silver [apk_static, cross_version]
}

// confidence: silver [apk_static, cross_version]
message DisplayCornerRadii
{
    optional uint32 top_left = 1;  // confidence: silver [apk_static, cross_version]
    optional uint32 top_right = 2;  // confidence: silver [apk_static, cross_version]
    optional uint32 bottom_left = 3;  // confidence: silver [apk_static, cross_version]
    optional uint32 bottom_right = 4;  // confidence: silver [apk_static, cross_version]
}

// confidence: silver [apk_static, cross_version]
message NativeUIElement
{
    optional UIElementPosition position = 1; // 17.3: xir.c -> xlh; converted to android.graphics.Rect  // confidence: silver [apk_static, cross_version]
    optional NativeUIElementType element_type = 2; // Runtime accepts numeric values 1-3  // confidence: silver [apk_static, cross_version]
}

// confidence: silver [apk_static, cross_version]
enum NativeUIElementType
{
    NATIVE_UI_ELEMENT_UNKNOWN = 0;
    NATIVE_UI_ELEMENT_TYPE_1 = 1;  // confidence: silver [apk_static, cross_version]
    NATIVE_UI_ELEMENT_TYPE_2 = 2;  // confidence: silver [apk_static, cross_version]
    NATIVE_UI_ELEMENT_TYPE_3 = 3;  // confidence: silver [apk_static, cross_version]
}

// APK class: wcr
// confidence: silver [apk_static, cross_version]
enum UITheme
{
    UI_THEME_AUTOMATIC = 0;
    UI_THEME_LIGHT = 1;
    UI_THEME_DARK = 2;
}

// APK class: wcn (16.1); xmm (17.3)
// confidence: silver [apk_static, cross_version]
enum UIElement
{
    UI_ELEMENT_UNKNOWN = 0;
    UI_ELEMENT_CLOCK = 1;
    UI_ELEMENT_BATTERY_LEVEL = 2;
    UI_ELEMENT_PHONE_SIGNAL = 3;
    UI_ELEMENT_NATIVE_UI_AFFORDANCE = 4;
    // When the HU requests GAL version 4.3+, converts to
    // CarDisplayUiFeatures.hasClusterTurnCard (flag 16). For a lower request,
    // the list is ignored; no equivalent ServiceDiscoveryResponse mask 16 is
    // consumed.
    UI_ELEMENT_NAVIGATION_TURN_DATA_AVAILABLE = 5;
}

// APK class: vvn (16.1) — values confirmed in 16.2
// confidence: silver [apk_static, cross_version]
enum ResizeActionType
{
    ACTION_UNKNOWN = 0;
    ACTION_RESIZE_TO_SMALLER = 1;
    ACTION_RESIZE_TO_LARGER = 2;
}
