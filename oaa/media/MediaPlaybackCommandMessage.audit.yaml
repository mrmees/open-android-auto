message: MediaPlaybackCommand
confidence: retracted
last_updated: '2026-07-26'
retraction:
  date: '2026-03-06'
  reason: >
    Deep APK trace proved the class vuy is NOT MediaPlaybackCommand. It is
    ActionTakenNotification on the video channel (wire msg ID 0x800C). The original
    retraction also stated that 0x8002 does not exist — that was INCORRECT.
    Msg ID 0x8002 on CAR.GAL.INST is MediaPlaybackStatusEvent (APK class vxo),
    a completely different proto. See MediaPlaybackStatusEventMessage.audit.yaml.
  evidence:
    - "AA 17.3 itt.java:539-553 builds ActionTakenNotification and sends wire 0x800C"
    - "qnf.java (CAR.GAL.MEDIA): AV audio endpoint, not media status handler"
    - "iai.java (CAR.GAL.INST): handles 0x8002 as vxo (MediaPlaybackStatusEvent)"
  correction_2026_07_26: >
    Proto verification pipeline revealed qnf.java is the AV audio stream
    endpoint, not the media status handler. The media status handler is
    iai.java/hvx.java on CAR.GAL.INST. Android Auto 17.3 also confirms that
    ActionTakenNotification is wire 0x800C; 0x800D carries
    IntegratedOverlayParametersNotification.
