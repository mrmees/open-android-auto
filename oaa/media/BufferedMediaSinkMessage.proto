/*
 * Android Auto 17.3 Buffered Media Sink playback-status payload.
 *
 * ChannelDescriptor field 17 (presence bit 0x10000) identifies GAL service
 * type 21. Incoming raw ID 4 is HU -> Phone: the phone parses this proto and
 * consumes all six fields. IDs 1-3 and every outbound path remain unknown.
 *
 * Construction is separately gated by NeoplanFeature__enabled equaling
 * 834952858. Descriptor presence, manager registration, endpoint attachment,
 * and BUFFERED_MEDIA_WORKER start are distinct later steps. Static code does
 * not prove production enablement, a live endpoint, a response, a completed
 * transfer, or any downstream media operation.
 */

syntax = "proto2";

package oaa.proto.messages;

// confidence: bronze [apk_deep_trace]
enum BufferedMediaState {
    BUFFERED_MEDIA_STATE_UNKNOWN = 0;
    BUFFERED_MEDIA_STATE_PLAYING = 1;
    BUFFERED_MEDIA_STATE_PAUSED = 2;
    BUFFERED_MEDIA_STATE_STOPPED = 3;
    BUFFERED_MEDIA_STATE_BUFFERING = 4;
}

// Incoming raw ID 4, HU -> Phone: 17.3 parses and consumes these fields.
// IDs 1-3 are accepted by a range validator but their meanings are unknown.
// confidence: bronze [apk_deep_trace]
message BufferedMediaSinkMessage {
    optional int32 session_id = 1;  // confidence: bronze [apk_deep_trace]
    optional uint64 uid = 2;  // confidence: bronze [apk_deep_trace]
    optional uint64 current_position_ms = 3;  // confidence: bronze [apk_deep_trace]
    optional BufferedMediaState state = 4;  // confidence: bronze [apk_deep_trace]
    optional uint64 buffered_position_ms = 5;  // confidence: bronze [apk_deep_trace]
    optional uint64 content_duration_ms = 6;  // confidence: bronze [apk_deep_trace]
}
