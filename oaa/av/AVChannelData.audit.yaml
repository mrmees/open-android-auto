  description: >
    AVChannel field 8 is decoded as AndroidKeycode while constructing each
    CarDisplay. KEYCODE_NAVIGATION (65538) becomes content type NAVIGATION and
    KEYCODE_TURN_CARD (65544) becomes TURN_CARD. Lifecycle initialization copies
