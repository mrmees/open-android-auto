/*
 * RETRACTED legacy UI Config model.
 *
 * Deep handler tracing disproved the two request/reply pairs previously
 * documented here. The canonical video-channel messages are:
 *
 *   0x8009 = UpdateUiConfigRequest        (HU->Phone)
 *   0x800A = UpdateUiConfigRequest        (Phone->HU)
 *   0x8011 = UiConfigRequest              (Phone->HU, Material You tokens)
 *   0x8012 = UpdateHuUiConfigResponse     (HU->Phone)
 *
 * See oaa/video/UpdateUiConfigRequestMessage.proto,
 * oaa/video/UiConfigRequestMessage.proto, and
 * oaa/video/UpdateHuUiConfigResponse.proto. The definitions below are kept as
 * a compatibility tombstone and must not be assigned to wire IDs.
 */

syntax = "proto2";

package oaa.proto.messages;

// UI theme mode
// confidence: silver [apk_static, cross_version]
enum UiTheme {
    UI_THEME_AUTOMATIC = 0;
    UI_THEME_LIGHT = 1;
    UI_THEME_DARK = 2;
}

// Display area insets (pixels from edge)
// confidence: silver [apk_static, cross_version]
message Insets {
    optional uint32 top = 1;  // confidence: silver [apk_static, cross_version]
    optional uint32 bottom = 2;  // confidence: silver [apk_static, cross_version]
    optional uint32 left = 3;  // confidence: silver [apk_static, cross_version]
    optional uint32 right = 4;  // confidence: silver [apk_static, cross_version]
}

// UI configuration — margins, content area, theme
// confidence: silver [apk_static, cross_version]
message UiConfig {
    optional Insets margins = 1;  // confidence: silver [apk_static, cross_version]
    optional Insets content_insets = 2;  // confidence: silver [apk_static, cross_version]
    optional Insets stable_content_insets = 3;  // confidence: silver [apk_static, cross_version]
    optional UiTheme ui_theme = 4;  // confidence: silver [apk_static, cross_version]
}

// RETRACTED: no UpdateUiConfigReply message is used at wire 0x800A.
// Both directions use the canonical UpdateUiConfigRequest wrapper.

// confidence: retracted [deep_trace]
message UpdateUiConfigReply {
    optional UiConfig ui_config = 1;  // confidence: retracted [deep_trace]
}

// RETRACTED: the 0x8011 request is UiConfigRequest from Phone->HU and carries
// Material You token lists, not this legacy UiConfig structure.
// confidence: retracted [deep_trace]
message UpdateHuUiConfigRequest {
    optional UiConfig ui_config = 1;  // confidence: retracted [deep_trace]
}

// The canonical response is wire 0x8012 HU->Phone and is defined in
// oaa/video/UpdateHuUiConfigResponse.proto.
