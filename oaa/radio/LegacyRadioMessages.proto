/*
 * Legacy Radio v1 channel messages (pre-2020 AA versions)
 *
 * SUPERSEDED: These definitions are from the original broadcast radio API
 * which used channel/frequency-based tuning, individual request/response
 * pairs for each operation, and detailed HD Radio/RDS metadata structures.
 *
 * The modern radio API (RadioMessages.proto, AA v16.1+) uses:
 *   - ProgramSelector/ProgramIdentifier addressing (broadcastradio@2.0)
 *   - Unified RadioMetadata with inline HD/DAB fields
 *   - 10 messages (0x801A-0x8023) vs 25 messages (0x8001-0x8019)
 *   - Simpler surface: Tune, TuneDirection, Mute, FavoriteToggle, Search
 *
 * Key differences from modern API:
 *   - RadioType enum (AM/FM/HD/DAB/XM) vs RadioIdentifierType
 *   - Separate RdsData + HdRadioStationInfo vs unified RadioMetadata
 *   - Explicit StepChannel/SeekStation/ScanStations vs TuneDirection
 *   - Station presets management vs favorites list
 *   - Traffic incident data (not present in v2)
 *   - Channel spacing configuration (not present in v2)
 *   - Radio source enable/disable (not present in v2)
 *
 * Source: opencardev/aasdk (GPLv3), adapted to oaa conventions
 * Original: aap_protobuf/service/radio/
 *
 * Verified 2026-03-07: Confirmed NO ID conflicts with modern radio handler.
 *   - ibf.java (16.2) only handles 0x801A-0x8023 — zero overlap with 0x8001-0x8019
 *   - No legacy structures survive as dead code (RadioType, RdsData, HdRadioStationInfo,
 *     StationPreset, RadioProperties, TrafficIncident all completely absent)
 *   - XM/Sirius, OIRT, RBDS: zero references in entire APK
 *
 * confidence: bronze [external_reference, legacy_api, confirmed_dead_in_16.2]
 */

syntax = "proto2";

package oaa.proto.messages;

// ============================================================================
// Enums
// ============================================================================

// Legacy radio type — superseded by RadioIdentifierType in v2
// confidence: unverified
enum LegacyRadioType {
    LEGACY_RADIO_AM = 0;
    LEGACY_RADIO_FM = 1;
    LEGACY_RADIO_AM_HD = 2;
    LEGACY_RADIO_FM_HD = 3;
    LEGACY_RADIO_DAB = 4;
    LEGACY_RADIO_XM = 5;       // XM/Sirius — not present in v2 API
}

// ITU region for radio band allocation
// Compare: our RadioRegionEnum has only UNKNOWN/ITU_1;
// this legacy version has more granularity.
// confidence: unverified
enum LegacyItuRegion {
    LEGACY_REGION_NONE = 0;
    LEGACY_REGION_ITU_1 = 1; // Europe, Africa, Middle East, former USSR  // confidence: unverified
    LEGACY_REGION_ITU_2 = 2; // Americas  // confidence: unverified
    LEGACY_REGION_OIRT = 3;    // Eastern Europe (legacy FM band 65-74 MHz)
    LEGACY_REGION_JAPAN = 4;   // Japan (76-95 MHz FM)
    LEGACY_REGION_KOREA = 5;   // South Korea
}

// RDS (Radio Data System) implementation type
// confidence: unverified
enum LegacyRdsType {
    LEGACY_RDS_NONE = 0;
    LEGACY_RDS_RDS = 1;       // European RDS
    LEGACY_RDS_RBDS = 2;      // North American RBDS
}

// HD Radio acquisition state
// confidence: unverified
enum LegacyHdAcquisitionState {
    LEGACY_HD_ANALOG = 0;         // Receiving analog only
    LEGACY_HD_ACQUIRING = 1;      // HD signal detected, acquiring
    LEGACY_HD_ACQUIRED = 2;       // HD digital signal locked
}

// Traffic service type
// confidence: unverified
enum LegacyTrafficServiceType {
    LEGACY_TRAFFIC_NONE = 0;
    LEGACY_TRAFFIC_TMC = 1;       // Traffic Message Channel (RDS-TMC)
}

// ============================================================================
// Legacy message IDs (0x8001-0x8019, 25 messages)
// ============================================================================

// confidence: unverified
enum LegacyRadioMessageId {
    LEGACY_RADIO_ACTIVE_NOTIFICATION = 0x8001;
    LEGACY_RADIO_SELECT_ACTIVE_REQUEST = 0x8002;
    LEGACY_RADIO_STEP_CHANNEL_REQUEST = 0x8003;
    LEGACY_RADIO_STEP_CHANNEL_RESPONSE = 0x8004;
    LEGACY_RADIO_SEEK_STATION_REQUEST = 0x8005;
    LEGACY_RADIO_SEEK_STATION_RESPONSE = 0x8006;
    LEGACY_RADIO_SCAN_STATIONS_REQUEST = 0x8007;
    LEGACY_RADIO_SCAN_STATIONS_RESPONSE = 0x8008;
    LEGACY_RADIO_TUNE_TO_STATION_REQUEST = 0x8009;
    LEGACY_RADIO_TUNE_TO_STATION_RESPONSE = 0x800A;
    LEGACY_RADIO_GET_PROGRAM_LIST_REQUEST = 0x800B;
    LEGACY_RADIO_GET_PROGRAM_LIST_RESPONSE = 0x800C;
    LEGACY_RADIO_STATION_PRESETS_NOTIFICATION = 0x800D;
    LEGACY_RADIO_CANCEL_OPERATIONS_REQUEST = 0x800E;
    LEGACY_RADIO_CANCEL_OPERATIONS_RESPONSE = 0x800F;
    LEGACY_RADIO_CONFIGURE_SPACING_REQUEST = 0x8010;
    LEGACY_RADIO_CONFIGURE_SPACING_RESPONSE = 0x8011;
    LEGACY_RADIO_STATION_INFO_NOTIFICATION = 0x8012;
    LEGACY_RADIO_MUTE_REQUEST = 0x8013;
    LEGACY_RADIO_MUTE_RESPONSE = 0x8014;
    LEGACY_RADIO_GET_TRAFFIC_REQUEST = 0x8015;
    LEGACY_RADIO_GET_TRAFFIC_RESPONSE = 0x8016;
    LEGACY_RADIO_SOURCE_REQUEST = 0x8017;
    LEGACY_RADIO_SOURCE_RESPONSE = 0x8018;
    LEGACY_RADIO_STATE_NOTIFICATION = 0x8019;
}

// ============================================================================
// Sub-messages — Station identification
// ============================================================================

// Frequency range for a radio band
// confidence: unverified
message LegacyRadioRange {
    optional int32 min = 1; // Minimum frequency (Hz or channel number)  // confidence: unverified
    optional int32 max = 2; // Maximum frequency  // confidence: unverified
}

// Geographic location (used by HD Radio SIS and traffic)
// confidence: unverified
message LegacyRadioLocation {
    optional double longitude = 1;  // confidence: unverified
    optional double latitude = 2;  // confidence: unverified
}

// Radio tuner hardware properties (part of SDP/service discovery)
// confidence: unverified
message LegacyRadioProperties {
    optional int32 radio_id = 1;  // confidence: unverified
    optional LegacyRadioType type = 2;  // confidence: unverified
    repeated LegacyRadioRange channel_range = 3;  // confidence: unverified
    repeated int32 channel_spacings = 4; // Available spacing values (kHz)  // confidence: unverified
    optional int32 channel_spacing = 5; // Current spacing  // confidence: unverified
    optional bool background_tuner = 6; // Can tune in background  // confidence: unverified
    optional LegacyItuRegion region = 7;  // confidence: unverified
    optional LegacyRdsType rds = 8;  // confidence: unverified
    optional bool af_switch = 9; // RDS AF (Alternative Frequency) switching  // confidence: unverified
    optional bool ta = 10; // RDS TA (Traffic Announcement) support  // confidence: unverified
    optional LegacyTrafficServiceType traffic_service = 11;  // confidence: unverified
    optional bool audio_loopback = 12;  // confidence: unverified
    optional bool mute_capability = 13;  // confidence: unverified
    optional int32 station_presets_access = 14; // Preset bank access flags  // confidence: unverified
}

// ============================================================================
// Sub-messages — Station metadata
// ============================================================================

// RDS (Radio Data System) data from FM broadcast
// confidence: unverified
message LegacyRdsData {
    repeated int32 alternative_frequencies = 1; // AF list (frequency values)  // confidence: unverified
    optional int32 program_id = 2; // RDS PI code  // confidence: unverified
    optional int32 music_speech_switch = 3; // M/S flag  // confidence: unverified
    optional string program_service_name = 4; // RDS PS (8 chars)  // confidence: unverified
    optional int32 program_type = 5; // RDS PTY code  // confidence: unverified
    optional string program_type_name = 6; // PTY as string  // confidence: unverified
    optional string radio_text = 7; // RDS RT (RadioText)  // confidence: unverified
    optional bool traffic_program_flag = 8; // RDS TP flag  // confidence: unverified
    optional bool traffic_announcement_flag = 9; // RDS TA flag  // confidence: unverified
}

// HD Radio PSD (Program Service Data) — song/program info
// confidence: unverified
message LegacyHdRadioPsdData {
    optional string title = 1;  // confidence: unverified
    optional string artist = 2;  // confidence: unverified
    optional string album = 3;  // confidence: unverified
    optional string genre = 4;  // confidence: unverified
    optional LegacyHdRadioComment comment = 5;  // confidence: unverified
    optional LegacyHdRadioCommercial commercial = 6;  // confidence: unverified
    optional LegacyHdRadioArtistExperience artist_experience = 7;  // confidence: unverified
}

// HD Radio SIS (Station Information Service) — station identity
// confidence: unverified
message LegacyHdRadioSisData {
    optional int32 station_id = 1;  // confidence: unverified
    optional string station_name_short = 2;  // confidence: unverified
    optional string station_name_long = 3;  // confidence: unverified
    optional LegacyRadioLocation station_location = 4;  // confidence: unverified
    optional string station_message = 5;  // confidence: unverified
    optional string service_info_message = 6;  // confidence: unverified
    optional string universal_short_station_name_slogan = 7;  // confidence: unverified
}

// HD Radio comment data
// confidence: unverified
message LegacyHdRadioComment {
    optional string description = 1;  // confidence: unverified
    optional string text = 2;  // confidence: unverified
}

// HD Radio commercial/advertising data
// confidence: unverified
message LegacyHdRadioCommercial {
    optional int32 encoding = 1;  // confidence: unverified
    optional string price = 2;  // confidence: unverified
    optional string valid = 3; // Validity/expiration  // confidence: unverified
    optional string url = 4;  // confidence: unverified
    optional int32 received = 5; // Timestamp  // confidence: unverified
    optional string seller = 6;  // confidence: unverified
    optional string description = 7;  // confidence: unverified
}

// HD Radio Artist Experience — album art via HD Radio
// confidence: unverified
message LegacyHdRadioArtistExperience {
    optional bytes image = 1; // Station logo or album art  // confidence: unverified
}

// HD Radio combined station info
// confidence: unverified
message LegacyHdRadioStationInfo {
    optional LegacyHdAcquisitionState acquisition_state = 1;  // confidence: unverified
    optional int32 digital_signal_strength = 2;  // confidence: unverified
    optional LegacyHdRadioPsdData psd = 3;  // confidence: unverified
    optional LegacyHdRadioSisData sis = 4;  // confidence: unverified
}

// Station metadata — audio quality + RDS + HD Radio
// confidence: unverified
message LegacyRadioStationMetaData {
    optional int32 audio_channels = 1; // Mono/stereo  // confidence: unverified
    optional int32 signal_quality = 2; // Signal strength indicator  // confidence: unverified
    optional LegacyRdsData rds = 3;  // confidence: unverified
    optional LegacyHdRadioStationInfo hd_station_info = 4;  // confidence: unverified
}

// Station identification — type + channel + metadata
// confidence: unverified
message LegacyRadioStationInfo {
    optional LegacyRadioType type = 1;  // confidence: unverified
    optional int32 channel = 2; // Frequency (Hz) or channel number  // confidence: unverified
    optional int32 sub_channel = 3; // HD Radio sub-channel  // confidence: unverified
    optional LegacyRadioStationMetaData meta_data = 4;  // confidence: unverified
}

// ============================================================================
// Sub-messages — Station presets
// ============================================================================

// A saved station preset
// confidence: unverified
message LegacyStationPreset {
    optional LegacyRadioType type = 1;  // confidence: unverified
    optional int32 channel = 2;  // confidence: unverified
    optional int32 sub_channel = 3;  // confidence: unverified
}

// A named list of presets (e.g., "FM Favorites")
// confidence: unverified
message LegacyStationPresetList {
    optional string name = 1;  // confidence: unverified
    repeated int32 restricted_station_types = 2; // RadioType values allowed  // confidence: unverified
    repeated LegacyStationPreset presets = 3;  // confidence: unverified
}

// Traffic incident report
// confidence: unverified
message LegacyTrafficIncident {
    optional int32 event_code = 1; // TMC event code  // confidence: unverified
    optional LegacyRadioLocation location = 2;  // confidence: unverified
    optional int32 expected_incident_duration = 3; // Duration in seconds  // confidence: unverified
}

// ============================================================================
// Top-level messages — Notifications (Phone <- HU, unsolicited updates)
// ============================================================================

// 0x8001: ActiveRadioNotification
// Current active radio and its station info.
// confidence: unverified
message LegacyActiveRadioNotification {
    optional int32 status = 1; // MessageStatus enum value  // confidence: unverified
    optional int32 radio_id = 2;  // confidence: unverified
    optional LegacyRadioStationInfo station_info = 3;  // confidence: unverified
}

// 0x800D: StationPresetsNotification
// Updated preset lists from the HU.
// NOTE: Field numbering starts at 2 (no field 1) per opencardev source.
// confidence: unverified
message LegacyStationPresetsNotification {
    repeated LegacyStationPresetList preset_lists = 2;  // confidence: unverified
}

// 0x8012: RadioStationInfoNotification
// Station info update for a specific radio.
// confidence: unverified
message LegacyRadioStationInfoNotification {
    optional int32 radio_id = 1;  // confidence: unverified
    optional LegacyRadioStationInfo station_info = 2;  // confidence: unverified
}

// 0x8019: RadioStateNotification
// Full radio state snapshot — source, mute, active radio, stations, presets.
// confidence: unverified
message LegacyRadioStateNotification {
    optional bool radio_source_enabled = 1;  // confidence: unverified
    optional bool radio_muted = 2;  // confidence: unverified
    optional int32 active_radio_id = 3;  // confidence: unverified
    optional LegacyRadioStationInfo station_info = 4;  // confidence: unverified
    repeated LegacyRadioStationInfo program_list = 5;  // confidence: unverified
    repeated LegacyStationPresetList station_preset_lists = 6;  // confidence: unverified
}

