/*
 * Vehicle energy model data (sensor type 23 = VEHICLE_ENERGY_MODEL).
 *
 * Android Auto 17.3 carries a structured vehicle-info payload. Distinct from
 * RawVehicleEnergyModel (sensor 25), which carries an opaque bytes blob.
 *
 * APK class: vvg (AA v16.1), vus (AA v16.2) — proto3, 0 fields
 */
syntax="proto3";

package oaa.proto.data;

// 17.3 xep — integer watt-hour quantity used for level and capacity.
message VehicleEnergyValue {
    int32 value = 1;  // confidence: gold [17.3_raw_message_info]
}

enum VehicleEnergyHvacStatus {
    UNKNOWN_HVAC_STATUS = 0;
    OFF_HVAC_STATUS = 1;
    ON_HVAC_STATUS = 2;
}

// 17.3 xer — diagnostic formatter names and prints each of these fields.
message VehicleEnergyInfo {
    VehicleEnergyValue battery_level_wh = 3;
    VehicleEnergyValue battery_capacity_wh = 4;
    VehicleEnergyHvacStatus hvac_status = 5;
    float external_temp_celsius = 7;
    float battery_temp_celsius = 8;
}

// confidence: gold [17.3_raw_message_info, 17.3_diagnostic_formatter]
message VehicleEnergyModelData {
    VehicleEnergyInfo vehicle_info = 1;
}
