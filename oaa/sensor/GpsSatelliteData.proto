/*
 * GPS satellite data (sensor type 21 = GPS).
 *
 * Carries satellite constellation information.
 *
 * APK class: vxs (AA v16.1), vxe (AA v16.2)
 * Sub-message class: vxd (AA v16.2) — 5 fields per satellite
 */
syntax="proto2";

package oaa.proto.data;

// Per-satellite information
// APK class: vxd (AA v16.2) — 5 fields
// confidence: silver [apk_static, cross_version]
message GpsSatelliteInfo
{
    required int32 prn = 1; // Satellite PRN/ID  // confidence: silver [apk_static, cross_version]
    required int32 snr = 2; // Signal-to-noise ratio  // confidence: silver [apk_static, cross_version]
    required bool in_use = 3; // Whether satellite is used in fix  // confidence: silver [apk_static, cross_version]
    optional int32 azimuth = 4; // Azimuth in degrees  // confidence: silver [apk_static, cross_version]
    optional int32 elevation = 5; // Elevation in degrees  // confidence: silver [apk_static, cross_version]
}

// confidence: silver [apk_static, cross_version]
message GpsSatelliteData
{
    required int32 satellite_count = 1;  // confidence: silver [apk_static, cross_version]
    optional int32 satellites_used = 2;  // confidence: silver [apk_static, cross_version]
    repeated GpsSatelliteInfo satellites = 3;  // confidence: silver [apk_static, cross_version]
}
