    disposition: invalidated
    current_class: abup
    lineage:
      - version: 16.2.660604-release
        apk_class: aafx
      - version: 16.4.661014-release
        apk_class: aayu
      - version: 17.3.662804-release
        apk_class: abup
    rejected_candidates: [abup]
    rationale: >-
      The six-field lineage is Google Surveys client context, not the Android
      Auto ServiceDiscoveryRequest phone-capabilities message.
    evidence:
      - >-
        RawMessageInfo is identical across aafx, aayu, and abup, including the
        repeated aagb/aayy/abut entry at field 5.
      - >-
        16.2 sources/p000/vdo.java:346-781 imports Surveys Answer and constructs
        aafx; 17.3 wmp.java:1616-2051 performs the corresponding abup conversion.

  - canonical_name: oaa.proto.data.TransportSecurityDetail
    disposition: invalidated
    current_class: abxz
    lineage:
      - version: 16.2.660604-release
        apk_class: aajh
      - version: 16.4.661014-release
        apk_class: abce
      - version: 17.3.662804-release
        apk_class: abxz
    rejected_candidates: [abrb, akef, sxq]
    rationale: >-
      The historical four-level child graph survives as Google authentication
      credential data, not Android Auto transport-security configuration; the
      three local candidates are unrelated two-way oneofs.
    evidence:
      - >-
        The graph is stable: two message fields -> five-string child plus
        repeated-message child -> two-string entries, with wrappers at fields
        2 then 1.
      - >-
        Alphabetic class-order deltas independently predict aajh -> abce ->
        abxz, matching the full recovered child graph in every release.
      - >-
        17.3 sources/defpackage/wfn.java references abxz/abya/abyb in
        GoogleAuthProviderImpl credential processing.

