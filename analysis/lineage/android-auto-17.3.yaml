# These anchors track class identity, then separately judge the historical
# canonical name against call-site semantics. An invalidated lineage is useful
# negative evidence: it must not be promoted as an Android Auto protocol name.
anchors:
  - canonical_name: oaa.proto.data.CapabilityConnectionEntry
    disposition: invalidated
    current_class: abud
    lineage:
      - version: 16.2.660604-release
        apk_class: aafl
      - version: 16.4.661014-release
        apk_class: aayi
      - version: 17.3.662804-release
        apk_class: abud
    rejected_candidates: [abum]
    rationale: >-
      The historical class lineage belongs to Google authentication data, while
      the same-shape 17.3 candidate abum belongs to a separate auth telemetry
      lineage; neither supports the capability-negotiation name.
    evidence:
      - >-
        RawMessageInfo and child order are stable across aafl, aayi, and abud:
        field 1 is a presence-tracked message and fields 2-6 are oneof messages.
      - >-
        17.3 sources/defpackage/wfn.java:555-928 constructs abud inside
        GoogleAuthProviderImpl account/token handling.
      - >-
        The structural look-alike follows aafu -> aayr -> abum and is written
        through the separate auth telemetry envelope abvm.

  - canonical_name: oaa.proto.data.CapabilityEntry
    disposition: invalidated
    current_class: abut
    lineage:
      - version: 16.2.660604-release
        apk_class: aagb
      - version: 16.4.661014-release
        apk_class: aayy
      - version: 17.3.662804-release
        apk_class: abut
    rejected_candidates: [abut]
    rationale: >-
      This stable class is a Google Surveys client-capability entry, not an
      Android Auto phone capability entry.
    evidence:
      - >-
        The ten-field schema and its position under aafx/aayu/abup are exact in
        all three releases.
      - >-
        16.2 sources/p000/vdo.java:534-769 imports the Surveys Answer model and
        constructs aagb while assembling survey request context.
      - >-
        17.3 sources/defpackage/wmp.java:1804-2021 constructs abut in the same
        survey-context conversion.

  - canonical_name: oaa.proto.data.HandwritingInputModelConfig
    disposition: invalidated
    current_class: abvg
    lineage:
      - version: 16.2.660604-release
        apk_class: aago
      - version: 16.4.661014-release
        apk_class: aazl
      - version: 17.3.662804-release
        apk_class: abvg
    rejected_candidates: [abvg]
    rationale: >-
      The five-field lineage is a Google Surveys request-context message; field
      2 is the survey client-capability object, not an input-model descriptor.
    evidence:
      - >-
        Field 2 follows aafx -> aayu -> abup across the same three releases.
      - >-
        17.3 sources/defpackage/wmp.java:1567-2106 builds abvg from survey data
        and appends failures such as FAILED_TO_FETCH_SURVEY.

